name: lstp
description: Livestock Smart Tracking System - Fuatilia mifugo yako kwa GPS
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI Icons
  cupertino_icons: ^1.0.8
  
  # Maps & Location
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3
  
  # State Management
  provider: ^6.1.1
  
  # Storage & Session
  shared_preferences: ^2.2.2
  
  # Media & Camera
  image_picker: ^1.0.5
  mobile_scanner: ^4.0.0
  
  # Permissions
  permission_handler: ^11.0.1
  
  # Networking
  http: ^1.1.0
  connectivity_plus: ^5.0.2
  dio: ^5.3.3

  flutter_animate: ^4.0.0

  carousel_slider: ^5.0.0
  
  # Utilities 
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo tracker.jpg"

flutter:
  uses-material-design: true
  
  # Assets 
  assets:
    - assets/images/
    - assets/images/cow.jpg
    - assets/images/sheep.jpg
    - assets/images/goat.jpg
    - assets/images/pig.jpg